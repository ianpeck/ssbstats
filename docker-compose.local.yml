# Local-only Kafka + Flink stack for the Gamecast / live match feature.
# Nothing here is used in production. Bring up:
#   docker compose -f docker-compose.local.yml up -d
# Tear down:
#   docker compose -f docker-compose.local.yml down -v

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: ssbstats-kafka
    ports:
      - "9094:9094"   # external (host machine)
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ssbstats-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  flink-jobmanager:
    build:
      context: ./streaming_jobs/flink
    image: ssbstats-flink-pyflink:1.18.1
    container_name: ssbstats-flink-jm
    ports:
      - "8081:8081"   # Flink Web UI
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
    volumes:
      - ./streaming_jobs/flink/lib:/opt/flink/usrlib   # connector jars
      - ./streaming_jobs/flink/jobs:/opt/flink/jobs    # PyFlink scripts

  flink-taskmanager:
    build:
      context: ./streaming_jobs/flink
    image: ssbstats-flink-pyflink:1.18.1
    container_name: ssbstats-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./streaming_jobs/flink/lib:/opt/flink/usrlib
      - ./streaming_jobs/flink/jobs:/opt/flink/jobs

volumes:
  kafka-data:
