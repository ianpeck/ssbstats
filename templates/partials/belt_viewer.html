<div class="belt-viewer" id="beltViewer" hidden>
    <div class="belt-viewer-panel" role="dialog" aria-modal="true" aria-labelledby="beltViewerTitle">
        <button type="button" class="belt-viewer-close" id="beltViewerClose" aria-label="Close"><i data-lucide="x"></i></button>
        <img class="belt-viewer-image" id="beltViewerImage" alt="">
        <div class="belt-viewer-caption">
            <div>
                <h2 class="belt-viewer-title" id="beltViewerTitle"></h2>
                <p class="belt-viewer-meta" id="beltViewerMeta"></p>
            </div>
            <a class="champ-history-link" id="beltViewerLink" href="#">Full history <i data-lucide="arrow-right"></i></a>
        </div>
    </div>
</div>
