<div class="compare-hero">
    <div class="compare-fighter-slot">
        <div class="portrait-frame" id="f1Frame">
            <img id="f1Img" src="{{ url_for('static', filename='assets/other/placeholder-fighter1.svg') }}" alt="Fighter 1">
        </div>
        <div class="autocomplete-wrapper">
            <input type="text" id="f1Input" class="fighter-input" placeholder="Fighter 1" data-category="fighters" autocomplete="off">
            <div class="autocomplete-dropdown" id="f1Dropdown"></div>
        </div>
    </div>

    <div class="compare-vs-col">
        <div class="vs-text">VS</div>
        <button class="btn btn-primary btn-lg" id="compareBtn" onclick="doCompare()">Compare</button>
        <div id="compareError" class="error-msg"></div>
    </div>

    <div class="compare-fighter-slot">
        <div class="portrait-frame" id="f2Frame">
            <img id="f2Img" src="{{ url_for('static', filename='assets/other/placeholder-fighter2.svg') }}" alt="Fighter 2">
        </div>
        <div class="autocomplete-wrapper">
            <input type="text" id="f2Input" class="fighter-input" placeholder="Fighter 2" data-category="fighters" autocomplete="off">
            <div class="autocomplete-dropdown" id="f2Dropdown"></div>
        </div>
    </div>
</div>
