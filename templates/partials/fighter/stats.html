<section class="fighter-stats-section" id="section-stats">
    <div class="fighter-stats-shell">
        <div class="fighter-stats-intro">
            <div class="fighter-analytics-title-row">
                <span class="fight-history-icon fighter-analytics-icon"><i data-lucide="chart-column"></i></span>
                <h2 class="fighter-stats-heading">Breakdown</h2>
            </div>
        </div>

        <div class="fighter-stats-grid" id="statsGrid" style="display:none;">
            <div class="stats-table-wrapper glass-card fighter-stats-card fighter-stats-card-feature">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="trophy"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">Power Rankings</h3>
                        <p class="analytics-chart-subtitle">End-of-season score and rank</p>
                    </div>
                </div>
                <div id="powerScoreTableWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card fighter-stats-card fighter-stats-card-feature">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="calendar"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">By Season</h3>
                        
                    </div>
                </div>
                <div id="seasonTableWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card fighter-stats-card">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="swords"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">By Match Type</h3>
                        
                    </div>
                </div>
                <div id="fightTypeTableWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card fighter-stats-card">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="layers"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">By Brand</h3>
                        
                    </div>
                </div>
                <div id="brandTableWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card stats-card-full fighter-stats-card">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="crown"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">Title Fights</h3>
                        
                    </div>
                </div>
                <div id="champLogoGridWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card stats-card-full fighter-stats-card">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="tv"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">Pay-Per-Views</h3>
                        
                    </div>
                </div>
                <div id="ppvLogoGridWrap"></div>
            </div>

            <div class="stats-table-wrapper glass-card stats-card-full fighter-stats-card">
                <div class="fighter-stats-card-header">
                    <span class="fighter-stats-card-icon"><i data-lucide="map"></i></span>
                    <div>
                        <h3 class="analytics-chart-title">Stages</h3>
                        <p class="analytics-chart-subtitle">Bigger block, more fights. Greener, better record.</p>
                    </div>
                </div>
                <div id="locationHeatmapWrap"></div>
            </div>
        </div>
    </div>
</section>
