<section class="compare-against-section">
    <div class="compare-against-card glass-card">
        <div class="ca-header">
            <span class="ca-icon"><i data-lucide="swords"></i></span>
            <span class="ca-title">Compare Against</span>
        </div>
        <div class="ca-body">
            <div class="ca-matchup">
                <div class="ca-fighter">
                    <div class="ca-avatar ca-avatar-self">
                        <img class="ca-portrait" src="{{ url_for('static', filename='assets/fighters/' + filename + '.png') }}" alt="{{ fighter_name }}" onerror="this.style.opacity='0.3'">
                    </div>
                    <span class="ca-name">{{ fighter_name }}</span>
                </div>
                <span class="ca-vs">VS</span>
                <div class="ca-fighter">
                    <div class="ca-avatar is-empty" id="caOpponentAvatar">
                        <img class="ca-portrait" id="caOpponentPortrait" src="" alt="">
                        <span class="ca-avatar-q" aria-hidden="true">?</span>
                    </div>
                    <span class="ca-name ca-opponent-name" id="caOpponentName">Opponent</span>
                </div>
            </div>
            <div class="autocomplete-wrapper ca-search-wrap">
                <input type="text" id="caInput" class="ca-input fighter-input" placeholder="Search a fighter to compare…" data-category="fighters" autocomplete="off">
                <div class="autocomplete-dropdown" id="caDropdown"></div>
            </div>
            <button class="btn btn-primary ca-btn" id="caBtn">Compare <i data-lucide="arrow-right"></i></button>
        </div>
    </div>
</section>
