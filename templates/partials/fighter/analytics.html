<section class="fighter-advanced-analytics" id="section-analytics">
    <div class="stats-table-wrapper glass-card fight-history-card">
        <div class="fight-history-header">
            <div class="fighter-stats-intro fighter-analytics-intro">
                <div class="fighter-analytics-title-row">
                    <span class="fight-history-icon fighter-analytics-icon"><i data-lucide="chart-line"></i></span>
                    <h2 class="fighter-stats-heading">Analytics</h2>
                </div>
            </div>
        </div>
        <div class="loading-overlay" id="advancedAnalyticsLoading"
             style="display:none; position:relative; min-height:90px; border-radius:0;">
            <div class="spinner"></div>
        </div>
        <div class="advanced-analytics-content" id="advancedAnalyticsContent">
            <div class="analytics-chart-wrapper">
                <h3 class="analytics-chart-title">Momentum</h3>
                <p class="analytics-chart-subtitle">Career win rate after every fight. Dashed: season pace and 50%.</p>
                <div class="analytics-chart-scroll">
                    <div class="analytics-chart-container" id="runningWinRateContainer">
                        <canvas id="runningWinRateChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="analytics-divider"></div>

            <div class="analytics-chart-wrapper">
                <h3 class="analytics-chart-title">Elo Rating</h3>
                <p class="analytics-chart-subtitle">Adjusts for opponent strength. 1500 is league average.</p>
                <div class="analytics-chart-scroll">
                    <div class="analytics-chart-container" id="eloChartContainer">
                        <canvas id="eloChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="analytics-divider"></div>

            <div class="analytics-chart-wrapper">
                <h3 class="analytics-chart-title">Victims &amp; Nemeses</h3>
                <div class="rivals-section" id="rivalsSection"></div>
            </div>

            <div class="analytics-divider"></div>

            <div class="analytics-chart-wrapper">
                <h3 class="analytics-chart-title">Streaks</h3>
                <p class="analytics-chart-subtitle">Wins up, losses down. Brightest bar is the current run.</p>
                <div class="analytics-chart-container" style="height: 260px;">
                    <canvas id="streakChart"></canvas>
                </div>
            </div>

            <div class="analytics-divider"></div>

            <div class="analytics-chart-wrapper">
                <h3 class="analytics-chart-title">Season by Season</h3>
                <p class="analytics-chart-subtitle">Each season graded 0&ndash;100.</p>
                <div class="analytics-chart-container" style="height: 420px;">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</section>
