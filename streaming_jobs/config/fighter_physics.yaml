# Fighter physics for the local-only match telemetry synthesizer.
# Weights from Smash Ultimate (Bowser=135 heaviest, Pichu=62 lightest).
# Names MUST match the Fighter_Name values in the SmashBros DB.
#
# Each fighter only needs to override what differs from `defaults`.
# This file is consumed by streaming_jobs/synthesizer/ and never by the prod app.

defaults:
  weight: 100
  damage_range: [2, 25]   # per-hit damage roll (inclusive)
  fall_speed: 1.0         # reserved for future use (combo vulnerability, recovery)
  starting_stocks: 3
  ko_curve:
    threshold: 155        # medium-weight danger percent; scaled lower/higher by fighter weight
    steepness: 0.055      # sharper curve so fighters do not linger forever at high damage

